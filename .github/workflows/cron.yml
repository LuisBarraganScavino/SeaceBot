name: Evaluador SEACE

on:
  schedule:
    # Se ejecuta de lunes a viernes en horario laboral peruano (8:00 AM, 11:00 AM, 2:00 PM y 5:00 PM)
    - cron: '0 13,16,19,22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-seace:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias y Navegador Virtual
        run: |
          pip install requests beautifulsoup4 urllib3 playwright
          playwright install chromium --with-deps

      - name: Ejecutar Rastreador
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python seace_alert.py

      - name: Guardar Registro de Procesados
        run: |
          git config --global user.name "SEACE-Bot"
          git config --global user.email "bot@github.com"
          git add processed_ids.json || true
          git commit -m "Actualizar historial de alertas" || exit 0
          git push
